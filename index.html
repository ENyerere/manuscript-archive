<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<!-- 浏览器 chrome(网址栏/状态栏)取色:JS 加载前的默认值,切换主题时由 useTheme 动态更新 -->
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
	<title>小峄热心市民</title>

	<!-- favicon 图标:%BASE_URL% 构建期替换为部署根路径(/ 或 /manuscript-archive/),深链接下也能正确解析 -->
	<link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png">
	<link rel="manifest" href="%BASE_URL%site.webmanifest">

	<!-- RSS 自动发现(构建期生成 feed.xml) -->
	<link rel="alternate" type="application/rss+xml" title="小峄热心市民 · RSS" href="%BASE_URL%feed.xml">

	<!--
		SPA 深链接回退解码(与 public/404.html 配套):
		把 404 页编码进 query 的原始路径还原为真实路由。
	-->
	<script type="text/javascript">
		(function (l) {
			if (l.search[1] === '/') {
				var decoded = l.search
					.slice(1)
					.split('&')
					.map(function (s) {
						return s.replace(/~and~/g, '&');
					})
					.join('/');
				window.history.replaceState(
					null,
					'',
					l.pathname.slice(0, -1) + decoded + l.hash
				);
			}
		})(window.location);
	</script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
