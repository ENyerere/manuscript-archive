name: Deploy to Aliyun Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.SERVER_KNOWN_HOSTS }}

      - name: Rsync dist to server
        run: >
          rsync -avz --delete
          dist/
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/blog/
