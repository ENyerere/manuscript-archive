<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<title>重定向中…</title>
	<!--
		SPA 深链接回退(GitHub Pages):
		静态托管对 /posts/xxx 等前端路由返回 404。本页把原始路径编码进
		query string 并重定向回 index.html,由其中的解码脚本还原路由。
		参考:https://github.com/rafgraph/spa-github-pages

		pathSegmentsToKeep 由构建期按 VITE_BASE 的段数自动改写(build/staticPages.ts):
		根路径部署为 0,项目页 /manuscript-archive/ 为 1。
		文章/标签/系列等路由已预生成静态 HTML,通常不会落到本页。
	-->
	<script type="text/javascript">
		var pathSegmentsToKeep = 0;

		var l = window.location;
		l.replace(
			l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
			l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
			l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
			(l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
			l.hash
		);
	</script>
</head>

<body>
</body>

</html>
